#Thruster command topics to bridge from ROS to Gazebo. Each topic corresponds to a single thruster's commanded thrust value.
- topic_name: /model/auv/joint/surge_front_left_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
  lazy: true

- topic_name: /model/auv/joint/surge_front_right_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
  lazy: true

- topic_name: /model/auv/joint/surge_back_left_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
  lazy: true

- topic_name: /model/auv/joint/surge_back_right_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
  lazy: true

- topic_name: /model/auv/joint/heave_left_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
  lazy: true

- topic_name: /model/auv/joint/heave_right_joint/cmd_thrust
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
  lazy: true

# Keyboard keypresses — bridged so simulator_bridge can do yaw-aware thrust allocation
- ros_topic_name: "/keyboard/keypress"
  gz_topic_name: "/keyboard/keypress"
  ros_type_name: "std_msgs/msg/Int32"
  gz_type_name: "gz.msgs.Int32"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: false
  direction: GZ_TO_ROS

