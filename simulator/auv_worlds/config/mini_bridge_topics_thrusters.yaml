# --- SERVICES (ROS calls Gazebo) ---

- ros_service_name: "/world/underwater_pool/control"
  gz_service_name: "/world/underwater_pool/control"
  ros_type_name: "ros_gz_interfaces/srv/ControlWorld"
  gz_req_type_name: "gz.msgs.WorldControl"
  gz_rep_type_name: "gz.msgs.Boolean"

- ros_service_name: "/world/underwater_pool/set_pose"
  gz_service_name: "/world/underwater_pool/set_pose"
  ros_type_name: "ros_gz_interfaces/srv/SetEntityPose"
  gz_req_type_name: "gz.msgs.Pose"
  gz_rep_type_name: "gz.msgs.Boolean"