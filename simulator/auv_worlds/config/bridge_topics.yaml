# ROS <-> Ignition Gazebo bridge topic definitions
# lazy: true means the bridge only activates when there is an active ROS subscriber/publisher
# Selective activation is controlled by simulator_bridge.py and vision nodes

# --- GZ TO ROS ---

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: true
  direction: GZ_TO_ROS

- ros_topic_name: "/model/auv/imu"
  gz_topic_name: "/model/auv/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: true
  direction: GZ_TO_ROS

- ros_topic_name: "/model/auv/odometry"
  gz_topic_name: "/model/auv/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: true
  direction: GZ_TO_ROS

- ros_topic_name: "/world/underwater_pool/dynamic_pose/info"
  gz_topic_name: "/world/underwater_pool/dynamic_pose/info"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: true
  direction: GZ_TO_ROS

- ros_topic_name: "/model/auv/pose"
  gz_topic_name: "/model/auv/pose"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: true
  direction: GZ_TO_ROS

