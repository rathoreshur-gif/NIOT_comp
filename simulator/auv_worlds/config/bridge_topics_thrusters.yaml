# --- Marker dropper (ROS to GZ) ---
# The marker's DetachableJoint plugin is declared in the AUV model and
# auto-attaches at world load, so the marker rides along until dropped.
- ros_topic_name: "/model/auv/marker_left/drop"
  gz_topic_name: "/model/auv/joint/marker_left_joint/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: false
  direction: ROS_TO_GZ

# The same joint's ATTACH topic. Publishing here re-welds the marker to the
# hull, which is how a second press of the drop button reloads it. The teleport
# that puts the marker back in its cradle first is simulator_bridge's job - the
# weld itself is fixed at whatever relative pose it finds.
- ros_topic_name: "/model/auv/marker_left/reload"
  gz_topic_name: "/model/auv/joint/marker_left_joint/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: false
  direction: ROS_TO_GZ


# --- Bin contact sensors (GZ to ROS) ---
# One per bin. The contact message carries both collision names and the world
# contact position, so the scorer learns which bin, which marker, and exactly
# where they touched - enough to reject a glancing hit on the outside.
- ros_topic_name: "/model/task3_bins/box_1/contact"
