# The rgbd_camera's point cloud is deliberately NOT bridged. Nothing subscribes
# to it: simulator_bridge takes image + depth_image instead. It was `lazy: true`,
# so it cost nothing while unsubscribed - removing it did not change RTF - but at
# the old resolution any casual `ros2 topic echo` pulled 26.9 MB per message
# (~62 MB/s) and would stall the machine. Re-add this block if a competitor stack
# genuinely needs /model/auv/front_camera/points.

