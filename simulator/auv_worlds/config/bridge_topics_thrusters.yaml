# --- Gripper DetachableJoint (payload attach / release) ---
# One attach/detach/state triple per graspable object, matching the one
# DetachableJoint instance each of them gets in m7urdfnew_sdf_package/model.sdf.
# The ROS side is namespaced by object - /model/auv/gripper/<object>/... - and
# simulator_bridge builds its publishers straight from that name, so the object
# names here, the <child_model> in model.sdf and the prop names in
# competition_config.yaml all have to agree.
#
# Not lazy: simulator_bridge must be able to publish the startup release before the
# initially-welded joints have a chance to drag the AUV around.
- ros_topic_name: "/model/auv/gripper/test_box/attach"
  gz_topic_name: "/model/auv/joint/gripper_test_box_joint/attach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: false
  direction: ROS_TO_GZ

- ros_topic_name: "/model/auv/gripper/test_box/detach"
  gz_topic_name: "/model/auv/joint/gripper_test_box_joint/detach"
  ros_type_name: "std_msgs/msg/Empty"
  gz_type_name: "gz.msgs.Empty"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: false
  direction: ROS_TO_GZ

