# --- Water disturbance ---
# Consumed by the Hydrodynamics plugin, which subscribes to the bare /ocean_current
# (no <namespace> set on the plugin). Drag is then computed from the vehicle's
# velocity relative to this water velocity.
- ros_topic_name: "/model/auv/ocean_current"
  gz_topic_name: "/ocean_current"
  ros_type_name: "geometry_msgs/msg/Vector3"
  gz_type_name: "gz.msgs.Vector3d"
  publisher_queue_size: 10
  subscriber_queue_size: 10
  lazy: false
  direction: ROS_TO_GZ

