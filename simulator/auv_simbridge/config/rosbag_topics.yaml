# Rosbag recording config
# active: true  -> skip from rosbag (topic is working fine, no need to record)
# active: false -> include in rosbag recording

topics:
  - name: /localization/pose
    active: false

  - name: /front_camera/image_raw
    active: true

  # Unpublished unless simulator_bridge is launched with
  # publish_stereo_frame:=true; /front_camera/rgbd_frame carries the same data.
  - name: /front_camera/oakd_frame
    active: false

  - name: /bottom_camera/image_raw
    active: true

  - name: /model/auv/imu
    active: false

  - name: /model/auv/odometry
    active: false

  - name: /model/auv/pose
    active: false

  - name: /clock
    active: false

  - name: /controller/thruster_forces
    active: false

  - name: /keyboard/keypress
    active: true

  # Recorded: it is what says where a run started and ended inside the bag.
  - name: /simulator/run_state
    active: false
